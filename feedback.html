<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提个意见 · Feedback · 谢子赫 Zihe Xie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #ffd63d; color: #111; line-height: 1.7;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
  }

  /* ========== 顶部导航 Header ========== */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 4vw; background: #ffd63d; border-bottom: 3px solid #111;
  }
  .logo {
    font-weight: 900; font-size: 1.1rem; color: #111; text-decoration: none;
    background: #fff; border: 3px solid #111; padding: 4px 14px;
    box-shadow: 4px 4px 0 #111; transform: rotate(-2deg); letter-spacing: 1px;
  }
  .logo em { font-style: normal; color: #ff6b9d; }
  .nav-right { display: flex; gap: 8px; align-items: center; }
  .nav-cta {
    color: #fff; text-decoration: none; font-weight: 800; font-size: .88rem;
    background: #4d96ff; border: 3px solid #111; padding: 7px 18px;
    box-shadow: 3px 3px 0 #111; transition: all .12s; margin-left: 6px;
  }
  .nav-cta:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 #111; }
  .lang-toggle {
    font-weight: 800; font-size: .85rem; cursor: pointer; font-family: inherit;
    color: #fff; background: #111; border: 3px solid #111;
    padding: 7px 14px; box-shadow: 3px 3px 0 rgba(0,0,0,.35); transition: all .12s;
  }
  .lang-toggle:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(0,0,0,.35); }

  /* ========== 布局与通用 ========== */
  .wrap { max-width: 920px; margin: 0 auto; padding: 120px 5vw 70px; }
  .box {
    background: #fff; border: 3px solid #111; box-shadow: 8px 8px 0 #111;
    padding: 36px 40px; margin-bottom: 36px;
    transition: transform .15s, box-shadow .15s;
  }
  .box:hover { transform: translate(-3px, -3px); box-shadow: 11px 11px 0 #111; }
  h2.sec { font-size: 1.6rem; font-weight: 900; margin: 0 0 22px; }
  h2.sec .bar { display: inline-block; width: 14px; height: 28px; margin-right: 10px; vertical-align: -4px; }
  .sub { font-weight: 800; font-size: .82rem; letter-spacing: 2px; margin: 18px 0 10px; }

  /* ========== 页头 Hero ========== */
  header.box { background: #ff6b9d; transform: rotate(-.6deg); }
  header.box:hover { transform: rotate(-.6deg) translate(-3px, -3px); }
  .sticker {
    display: inline-block; background: #111; color: #ffd63d; font-weight: 800;
    font-size: .8rem; letter-spacing: 2px; padding: 6px 14px; transform: rotate(2deg);
    margin-bottom: 22px;
  }
  h1 { font-size: clamp(2rem, 5.5vw, 3.4rem); font-weight: 900; letter-spacing: 1px; }
  h1 span { background: #fff; padding: 0 16px; box-shadow: 5px 5px 0 #111; display: inline-block; border: 3px solid #111; }
  .intro { margin-top: 24px; font-size: 1.05rem; font-weight: 600; }

  /* ========== 反馈表单 ========== */
  .form-box h2.sec .bar { background: #6bcb77; }
  .fb-type { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .fb-type label {
    cursor: pointer; font-weight: 700; font-size: .9rem; color: #111;
    background: #fff; border: 3px solid #111; padding: 8px 16px;
    box-shadow: 3px 3px 0 #111; transition: all .12s; user-select: none;
  }
  .fb-type label:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 #111; }
  .fb-type input { display: none; }
  .fb-type label:has(input:checked) { background: #ffd63d; transform: translate(2px,2px); box-shadow: 1px 1px 0 #111; }

  .f-label { display: block; font-weight: 800; font-size: .9rem; margin: 22px 0 8px; letter-spacing: 1px; }
  .f-input {
    width: 100%; font-family: inherit; font-weight: 600; font-size: .95rem; color: #111;
    border: 3px solid #111; padding: 12px 16px; background: #fff; outline: none;
    box-shadow: 4px 4px 0 #111; transition: box-shadow .12s;
  }
  .f-input:focus { box-shadow: 4px 4px 0 #4d96ff; }
  .f-area { resize: vertical; min-height: 140px; }

  .fb-submit {
    font-family: inherit; cursor: pointer; font-weight: 900; font-size: 1.05rem; color: #fff;
    background: #ff6b9d; border: 3px solid #111; padding: 14px 34px;
    box-shadow: 6px 6px 0 #111; transition: all .12s; margin-top: 26px;
  }
  .fb-submit:hover { transform: translate(3px,3px); box-shadow: 3px 3px 0 #111; }
  .fb-submit:active { transform: translate(5px,5px); box-shadow: 1px 1px 0 #111; }
  .fb-hint { margin-top: 14px; font-size: .8rem; font-weight: 700; color: #666; }
  .fb-hint.ok { color: #2f9e44; }
  .fb-hint.err { color: #e03131; }

  /* ========== 备选入口 ========== */
  .alt-box { background: #4cc9f0; }
  .alt-box h2.sec .bar { background: #111; }
  .alt-box p { font-weight: 600; }
  .w-link {
    display: inline-block; margin-top: 16px; font-weight: 800; font-size: .9rem; color: #111;
    text-decoration: none; background: #fff; border: 3px solid #111; padding: 9px 22px;
    box-shadow: 4px 4px 0 #111; transition: all .12s;
  }
  .w-link:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 #111; }

  /* ========== 页脚 ========== */
  footer { text-align: center; font-weight: 800; font-size: .85rem; letter-spacing: 1px; }
  footer a.foot-back {
    display: inline-block; margin-bottom: 16px; color: #111; font-weight: 800;
    text-decoration: none; background: #fff; border: 3px solid #111; padding: 8px 22px;
    box-shadow: 4px 4px 0 #111; transition: all .12s;
  }
  footer a.foot-back:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 #111; }
  footer .ver { background: #111; color: #ffd63d; padding: 2px 10px; margin-left: 6px; }

  /* ========== 边缘滑动的 emoji ========== */
  .emoji-field { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .float-emoji {
    position: absolute; font-size: 2.2rem; line-height: 1;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,.18));
    animation-iteration-count: infinite; animation-timing-function: ease-in-out;
    will-change: transform;
  }
  .e1 { left: 1.5vw; top: 26%; animation-name: bobY; animation-duration: 9s; }
  .e2 { right: 1.5vw; top: 44%; animation-name: bobY; animation-duration: 11s; animation-delay: 1s; }
  .e3 { left: 5vw; bottom: 16%; animation-name: slideX; animation-duration: 12s; }
  .e4 { right: 5vw; bottom: 12%; animation-name: bobX; animation-duration: 9s; animation-delay: .5s; }
  .e5 { left: 20%; top: 7%; animation-name: floaty; animation-duration: 10s; }
  .e6 { right: 16%; top: 9%; animation-name: floaty; animation-duration: 13s; animation-delay: 1.5s; }
  .e7 { left: 8vw; top: 52%; animation-name: bobY; animation-duration: 12s; animation-delay: 2s; }
  .e8 { right: 8vw; top: 62%; animation-name: bobX; animation-duration: 10s; animation-delay: 1.2s; }

  @keyframes bobY {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-90px) rotate(8deg); }
  }
  @keyframes slideX {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(64px) rotate(10deg); }
  }
  @keyframes bobX {
    0%, 100% { transform: translateX(0) rotate(8deg); }
    50% { transform: translateX(-72px) rotate(-8deg); }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-32px) rotate(-9deg); }
    75% { transform: translateY(22px) rotate(9deg); }
  }

  @media (max-width: 680px) {
    .wrap { padding-top: 96px; }
    .box { padding: 24px 18px; box-shadow: 5px 5px 0 #111; }
    .box:hover { transform: none; box-shadow: 5px 5px 0 #111; }
    header.box, header.box:hover { transform: none; }
    h1 { letter-spacing: 0; }
    h1 span { padding: 0 10px; }
    .float-emoji { font-size: 1.5rem; }
    .e5, .e6, .e7, .e8 { display: none; }
    .nav-cta { padding: 7px 12px; font-size: .8rem; }
    .lang-toggle { padding: 7px 10px; }
    .fb-submit { width: 100%; }
  }
</style>
</head>
<body>

<!-- 边缘滑动的 emoji 装饰 -->
<div class="emoji-field" aria-hidden="true">
  <span class="float-emoji e1">📝</span>
  <span class="float-emoji e2">💬</span>
  <span class="float-emoji e3">🚀</span>
  <span class="float-emoji e4">⭐</span>
  <span class="float-emoji e5">✨</span>
  <span class="float-emoji e6">🎨</span>
  <span class="float-emoji e7">👍</span>
  <span class="float-emoji e8">💡</span>
</div>

<nav>
  <a class="logo" href="index.html">ZX<em>!</em></a>
  <div class="nav-right">
    <a class="nav-cta" href="index.html" data-zh="← 返回主页" data-en="← Back home">← 返回主页</a>
    <button class="lang-toggle" id="langToggle">EN</button>
  </div>
</nav>

<div class="wrap" id="top">

  <header class="box">
    <span class="sticker" data-zh="★ 意见反馈 ★" data-en="★ FEEDBACK ★">★ 意见反馈 ★</span>
    <h1><span data-zh="提个意见" data-en="LEAVE FEEDBACK">提个意见</span></h1>
    <p class="intro" data-zh="看完主页，有任何想说的——一条建议、一个错别字、一句喜欢，都欢迎留给我。每一条我都会认真看。🙌" data-en="Saw something worth saying — a suggestion, a typo, a word of praise? Leave it here, I read every single one. 🙌">看完主页，有任何想说的——一条建议、一个错别字、一句喜欢，都欢迎留给我。每一条我都会认真看。🙌</p>
  </header>

  <section class="box form-box">
    <h2 class="sec"><span class="bar" style="background:#6bcb77;"></span><span data-zh="写点什么" data-en="Write something">写点什么</span></h2>

    <form id="fbForm" novalidate>
      <p class="sub" data-zh="// 反馈类型" data-en="// TYPE">// 反馈类型</p>
      <div class="fb-type">
        <label><input type="radio" name="fbType" value="suggest" checked><span data-zh="💡 建议" data-en="💡 Suggestion">💡 建议</span></label>
        <label><input type="radio" name="fbType" value="bug"><span data-zh="🐛 纠错" data-en="🐛 Bug report">🐛 纠错</span></label>
        <label><input type="radio" name="fbType" value="like"><span data-zh="👍 点赞" data-en="👍 Praise">👍 点赞</span></label>
        <label><input type="radio" name="fbType" value="other"><span data-zh="💬 其他" data-en="💬 Other">💬 其他</span></label>
      </div>

      <label class="f-label" for="fbName" data-zh="你的称呼（可选）" data-en="Your name (optional)">你的称呼（可选）</label>
      <input class="f-input" id="fbName" type="text" autocomplete="name" data-zh-ph="例如：小明" data-en-ph="e.g. Alex" placeholder="例如：小明">

      <label class="f-label" for="fbContact" data-zh="联系方式（可选，方便我回复）" data-en="Contact (optional, so I can reply)">联系方式（可选，方便我回复）</label>
      <input class="f-input" id="fbContact" type="text" autocomplete="off" data-zh-ph="邮箱 / 微信 / 手机号都可以" data-en-ph="Email / WeChat / phone — anything" placeholder="邮箱 / 微信 / 手机号都可以">

      <label class="f-label" for="fbMsg" data-zh="想说的话（必填）" data-en="Your message (required)">想说的话（必填）</label>
      <textarea class="f-input f-area" id="fbMsg" rows="6" data-zh-ph="尽管写，长短都欢迎～" data-en-ph="Go on, any length is welcome~" placeholder="尽管写，长短都欢迎～"></textarea>

      <button class="fb-submit" type="submit" data-zh="📮 发送反馈" data-en="📮 Send feedback">📮 发送反馈</button>
      <p class="fb-hint" id="fbHint" data-zh="点提交后会打开你的邮件客户端，把意见发到 zihexie95@gmail.com" data-en="Submit opens your email app and sends your note to zihexie95@gmail.com">点提交后会打开你的邮件客户端，把意见发到 zihexie95@gmail.com</p>
    </form>
  </section>

  <section class="box alt-box">
    <h2 class="sec"><span class="bar"></span><span data-zh="习惯用 GitHub？" data-en="Prefer GitHub?">习惯用 GitHub？</span></h2>
    <p data-zh="也可以直接去仓库开一个 Issue，我会在那边跟进回复。" data-en="You can also open an issue in the repo — I'll follow up there.">也可以直接去仓库开一个 Issue，我会在那边跟进回复。</p>
    <a class="w-link" href="https://github.com/zihexie95-dotcom/personal-homepage/issues/new" target="_blank" rel="noopener" data-zh="🐙 去 GitHub 提 Issue" data-en="🐙 Open an issue on GitHub">🐙 去 GitHub 提 Issue</a>
  </section>

</div>

<footer>
  <div><a href="index.html" class="foot-back" data-zh="← 返回个人主页" data-en="← Back to homepage">← 返回个人主页</a></div>
  <div>
    <span data-zh="© " data-en="© ">© </span><span id="year">2026</span><span data-zh=" 谢子赫 · 用 VIBE CODING 构建" data-en=" ZIHE XIE · BUILT WITH VIBE CODING"> 谢子赫 · 用 VIBE CODING 构建</span><span class="ver">V1.6</span>
  </div>
</footer>

<script>
  // ---- 年份自动更新 ----
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---- 中英双语切换（支持 ?lang=zh / ?lang=en）----
  const urlLang = new URLSearchParams(location.search).get('lang');
  let lang = (urlLang === 'zh' || urlLang === 'en') ? urlLang : (localStorage.getItem('zx-lang') || 'zh');
  const toggleBtn = document.getElementById('langToggle');

  function applyLang(l) {
    document.querySelectorAll('[data-zh]').forEach(el => {
      const txt = el.getAttribute('data-' + l);
      if (txt !== null) el.textContent = txt;
    });
    document.querySelectorAll('[data-zh-ph]').forEach(el => {
      const ph = el.getAttribute('data-' + l + '-ph');
      if (ph !== null) el.placeholder = ph;
    });
    document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
    toggleBtn.textContent = l === 'zh' ? 'EN' : '中';
    localStorage.setItem('zx-lang', l);
  }
  toggleBtn.addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    applyLang(lang);
  });
  applyLang(lang);

  // ---- 反馈提交：纯静态站用 mailto 组装邮件 ----
  const TYPE = {
    suggest: { zh: '建议', en: 'Suggestion' },
    bug:     { zh: '纠错', en: 'Bug report' },
    like:    { zh: '点赞', en: 'Praise' },
    other:   { zh: '其他', en: 'Other' }
  };
  const fbForm = document.getElementById('fbForm');
  const fbHint = document.getElementById('fbHint');

  fbForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('fbName').value.trim();
    const contact = document.getElementById('fbContact').value.trim();
    const msgEl = document.getElementById('fbMsg');
    const msg = msgEl.value.trim();

    if (!msg) {
      msgEl.focus();
      fbHint.textContent = lang === 'zh'
        ? '⚠️ 意见内容还是空的，写点什么再发送吧～'
        : '⚠️ Your message is empty — write something first~';
      fbHint.classList.remove('ok');
      fbHint.classList.add('err');
      return;
    }

    const typeKey = document.querySelector('input[name="fbType"]:checked').value;
    const typeLabel = TYPE[typeKey][lang];
    const subject = encodeURIComponent(`[主页反馈] ${typeLabel}${name ? ' · ' + name : ''}`);
    const body = encodeURIComponent(
      `类型：${typeLabel}\n称呼：${name || '（未留名）'}\n联系方式：${contact || '（未留）'}\n\n意见/建议：\n${msg}`
    );

    fbHint.classList.remove('err');
    fbHint.classList.add('ok');
    fbHint.textContent = lang === 'zh'
      ? '📨 已为你打开邮件客户端；若没弹出，请手动发到 zihexie95@gmail.com'
      : '📨 Opened your email app; if not, email zihexie95@gmail.com manually';

    window.location.href = `mailto:zihexie95@gmail.com?subject=${subject}&body=${body}`;
  });
</script>
</body>
</html>
